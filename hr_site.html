<style id="ca-hrc-css">
.ca-hrc .hr-data{display:none!important}
.ca-hrc .hr-intro-link{display:inline-block;margin-top:18px;padding:10px 22px;border:1px solid #1f6fae;border-radius:24px;color:#1f6fae;font-size:15px;font-weight:600;text-decoration:none;background:#fff}
.ca-hrc .hr-intro-link:hover{background:#1f6fae;color:#fff}
.hr-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 26px}
.hr-tabs button{border:1px solid #e2e7ee;background:#fff;color:#3a3a3a;border-radius:22px;padding:9px 16px;font-size:15px;cursor:pointer;font-family:inherit}
.hr-tabs button.on{background:#1f6fae;border-color:#1f6fae;color:#fff;font-weight:700}
.hr-list{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.hr-card{display:flex;flex-direction:column;gap:10px;text-align:left;background:#fff;border:1px solid #e2e7ee;border-radius:14px;padding:22px 20px 20px;color:#3a3a3a;text-decoration:none!important;transition:border-color .15s,transform .15s;min-width:0}
.hr-card:hover{border-color:#1f6fae;transform:translateY(-2px)}
.hr-card .top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.hr-chip{display:inline-block;background:#f0f6fc;color:#1f6fae;border-radius:14px;padding:4px 10px;font-weight:700;font-size:12.5px}
.hr-yr{color:#7b8592}
.hr-card h3{margin:0;font-size:18px;line-height:1.45;color:#222;letter-spacing:-.6px;font-weight:700}
.hr-card .ind{font-size:14px;color:#7b8592}
.hr-card .ind b{color:#222}
.hr-card .tg{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.hr-card .tg span{font-size:12.5px;color:#3a3a3a;background:#f4f7fb;border-radius:6px;padding:3px 8px}
.hr-more{display:flex;justify-content:center;margin:26px 0 0}
.hr-btn{display:inline-block;border:0;background:linear-gradient(#2f86c8,#16609e);color:#fff!important;border-radius:28px;padding:14px 30px;font-size:17px;font-weight:700;cursor:pointer;text-decoration:none!important;font-family:inherit}
.hr-btn.ghost{background:#fff;color:#1f6fae!important;border:1px solid #1f6fae}
.hr-cta{margin:56px 0 90px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;background:#f4f7fb;border-radius:16px;padding:28px 30px}
.hr-cta p{margin:0;font-size:18px;color:#222;line-height:1.6}
.hr-cta p small{display:block;color:#7b8592;font-size:14px}
@media (max-width:1023px){.hr-list{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.hr-list{grid-template-columns:1fr}.hr-tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px}.hr-tabs button{flex:0 0 auto}.hr-cta{padding:22px 20px}}
/* 컨설팅 신청 */
.ca-hra .cc-grid{grid-template-columns:repeat(4,1fr)}
@media (max-width:1023px){.ca-hra .cc-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.ca-hra .cc-grid{grid-template-columns:1fr}}
</style>
<script id="ca-hrc-js">
(function(){
 function esc(s){return String(s==null?'':s).replace(/[<>"]/g,function(c){return {'<':'\u0026lt;','>':'\u0026gt;','"':'\u0026quot;'}[c];});}
 var TABS=['근로시간·근무체계','임금체계','평가체계','장년고용안정','평생학습','고용문화·고용구조','유연·재택근무','직무·NCS','재취업지원','산업일자리전환','혁신파트너십','노무관리 진단'];
 function list(){
  var box=document.querySelector('.ca-hrc'); if(!box)return;
  var dEl=box.querySelector('.hr-data'); var D=[]; try{D=JSON.parse(dEl.textContent);}catch(e){}
  var root=document.createElement('div'); box.appendChild(root);
  var st={type:'전체',open:false}; try{var sv=JSON.parse(sessionStorage.getItem('ca_hrc')||'{}'); if(sv.type)st=sv;}catch(e){}
  function render(){
   var has={}; D.forEach(function(c){c.cats.forEach(function(k){has[k]=1;});});
   var shown=D.filter(function(c){return st.type==='전체'||c.cats.indexOf(st.type)>-1;});
   var LIM=6;
   var h='<div class="hr-tabs">'+['전체'].concat(TABS.filter(function(t){return has[t];})).map(function(t){return '<button type="button" data-t="'+t+'" class="'+(st.type===t?'on':'')+'">'+t+'</button>';}).join('')+'</div>';
   h+='<div class="hr-list">'+shown.map(function(c,i){var hid=i>=LIM;return '<a class="hr-card'+(hid?' xtra':'')+'"'+(hid && !st.open?' style="display:none"':'')+' href="/bbs/board.php?bo_table=hrcase'+String.fromCharCode(38)+'wr_id='+c.id+'"><div class="top"><span class="hr-chip">'+esc(st.type!=='전체'?st.type:c.cats[0])+'</span><span class="hr-yr">'+c.y+'</span></div><h3>'+esc(c.t)+'</h3><div class="ind"><b>'+esc(c.n)+'</b> · '+esc(c.ind)+'</div><div class="tg">'+(c.tg||[]).slice(0,3).map(function(t){return '<span>'+esc(t)+'</span>';}).join('')+'</div></a>';}).join('')+'</div>';
   if(shown.length>LIM)h+='<div class="hr-more"><button type="button" class="hr-btn ghost" id="hrMore">'+(st.open?'접기':'사례 더 보기')+'</button></div>';
   h+='<div class="hr-cta"><p>우리 회사에 맞는 인사노무 체계가 필요하신가요?<small>정부지원 컨설팅 활용 가능 여부까지 함께 검토해 드립니다.</small></p><a class="hr-btn" href="/bbs/content.php?co_id=hrapply">컨설팅 신청</a></div>';
   root.innerHTML=h;
   root.querySelectorAll('[data-t]').forEach(function(b){b.onclick=function(){st.type=b.dataset.t;st.open=false;save();render();};});
   var mb=document.getElementById('hrMore'); if(mb)mb.onclick=function(){st.open=!st.open;save();root.querySelectorAll('.xtra').forEach(function(x){x.style.display=st.open?'':'none';});mb.textContent=st.open?'접기':'사례 더 보기';if(!st.open)window.scrollTo(0,root.getBoundingClientRect().top+scrollY-120);};
   root.querySelectorAll('.hr-card').forEach(function(a){a.addEventListener('click',function(){st.y=scrollY;save();});});
  }
  function save(){try{sessionStorage.setItem('ca_hrc',JSON.stringify(st));}catch(e){}}
  render();
  if(st.y){var y=st.y; delete st.y; save(); setTimeout(function(){window.scrollTo(0,y);},60);}
 }
 function board(){
  if(!/bo_table=hrcase/.test(location.search))return;
  if(!/wr_id=/.test(location.search) && /\/bbs\/board\.php/.test(location.pathname)){location.replace('/bbs/content.php?co_id=hrconsult');return;}
  document.querySelectorAll('a[href*="bo_table=hrcase"]').forEach(function(a){if(!/wr_id=|write\.php|delete|update/.test(a.getAttribute('href')))a.setAttribute('href','/bbs/content.php?co_id=hrconsult');});
 }
 function init(){list();board();}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>

   fetch(f.action,{method:'POST',body:fd,credentials:'same-origin'}).then(function(r){return r.text().then(function(t){return {r:r,t:t};});}).then(function(o){
    if(/wr_id=\d+/.test(o.r.url)||(!/write_update/.test(o.r.url))){
     try{sessionStorage.removeItem(KEY);sessionStorage.removeItem('ca_hr_mode');}catch(e){}
     box.innerHTML='<div class="ca-head"><h2>컨설팅 신청이 <span>접수</span>되었습니다</h2><p style="line-height:1.7"><span style="white-space:nowrap"><b style="display:inline">'+esc(st.n)+' 노무사</b>가 내용을 확인한 뒤</span><br><span style="white-space:nowrap">남겨주신 연락처로 연락드리겠습니다.</span></p></div><div class="cc-done"><p>급한 문의는 전화 주시면 바로 안내해 드립니다.</p><a class="cc-call" href="tel:'+st.tel.replace(/-/g,'')+'" style="color:#fff!important;display:inline-flex;flex-direction:column;align-items:center;gap:2px;line-height:1.3;text-decoration:none"><span style="color:#fff!important;font-size:15px;font-weight:500;opacity:.9">'+esc(st.n)+' 노무사</span><span style="color:#fff!important;font-size:21px;font-weight:700;letter-spacing:.5px">'+st.tel+'</span></a><a class="cc-home" href="/">홈으로</a></div>';
     var hd=document.getElementById('header');var hh=hd?hd.offsetHeight:0;window.scrollTo(0,0);var rt=box.getBoundingClientRect().top;if(rt<hh+24)box.style.paddingTop=(hh+24-rt)+'px';
    } else {
     var m=(o.t.match(/alert\(["']([^"']+)/)||[])[1]||'접수 중 문제가 발생했습니다. 다시 시도해 주세요.';
     err.textContent=m; btn.disabled=false; btn.textContent='컨설팅 신청하기';
     var ri=document.getElementById('captcha_reload'); if(ri)ri.click();
    }
   }).catch(function(){err.textContent='네트워크 오류로 접수하지 못했습니다. 잠시 후 다시 시도해 주세요.';btn.disabled=false;btn.textContent='컨설팅 신청하기';});
  };
 }
 function init(){

  var hm=null; try{hm=sessionStorage.getItem('ca_hr_mode');}catch(e){}
  var m=location.search.match(/bo_table=(consult_(?:jung|shin))/);
  if(hm && m && /\/bbs\/write\.php/.test(location.pathname) && !/w=u/.test(location.search))writePage(m[1]);
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
